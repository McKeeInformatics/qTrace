plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.qtrace'
version = '1.1.5'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.scijava.org/content/repositories/public' }
}

ext.qupathVersion = '0.5.1'

javafx {
    version       = '21'
    modules       = ['javafx.controls', 'javafx.graphics', 'javafx.fxml', 'javafx.base']
    configuration = 'compileOnly'
}

dependencies {
    compileOnly "io.github.qupath:qupath-core:${qupathVersion}"
    compileOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'ch.qos.logback:logback-classic:1.4.14'
    implementation 'org.eclipse.jgit:org.eclipse.jgit:6.7.0.202309050840-r'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'qtrace-core'
    manifest {
        attributes 'Implementation-Title':   'QTrace Core',
                   'Implementation-Version': version,
                   'Built-By':               'Romain Tourte',
                   // Self-description read by the qTrace loader (docs/architecture/loader.md § 14)
                   'Qtrace-Module':          'core',
                   'Qtrace-Version':         version,
                   'Qtrace-Load-Order':      '10',
                   'Qtrace-Entry-Point':     'io.qtrace.QTraceExtension',
                   'Qtrace-Packages':        'io.qtrace'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'qupath/**', 'javafx/**', 'com/sun/**', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

apply from: 'gradle/qtjar.gradle'
