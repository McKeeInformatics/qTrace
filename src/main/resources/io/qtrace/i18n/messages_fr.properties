# Settings › Autosave — copie de l'image (reprise après crash)
settings.snapshot.title=Copie de l'image (reprise après crash)
settings.snapshot.intro=Pour restaurer une image exactement comme elle était après un crash, qTrace garde aussi une copie de ce que vous avez fait dessus : objets (annotations, détections, mesures) et historique — jamais les pixels. Elle n'existe que tant que l'image a des modifications non sauvegardées et disparaît dès que vous sauvegardez ou fermez l'image. Légère pour des annotations, elle peut atteindre des centaines de Mo avec beaucoup de détections, et elle est réécrite en entier à chaque copie.
settings.snapshot.auto=Auto (recommandé) — petites images copiées à chaque changement ; grandes images juste après les étapes clés, les autres retouches au plus toutes les {0} s
settings.snapshot.custom=Personnalisé — réglez vous-même les limites
settings.snapshot.threshold=Une image est « grande » à partir de (Mo d'objets)
settings.snapshot.interval=Copier les grandes images au plus toutes les (secondes)
settings.snapshot.keyOnly=Grandes images : copier seulement après les étapes clés (jamais pour de simples retouches)
settings.snapshot.keyOnly.hint=Étapes clés : toute commande QuPath (détection, classifier, script, mesures…) et tout lot d'au moins 10 objets ajoutés ou supprimés d'un coup. Retouches : dessiner, déplacer, remodeler, renommer ou reclasser quelques objets.
settings.snapshot.consequences=Ce que cela implique pour vous
settings.snapshot.off=L'enregistrement continu est désactivé : rien n'est enregistré sans stamp, et rien ne peut être restauré après un crash.
settings.snapshot.c.capture=Votre capture qTrace (étapes, corrections, notes) est toujours enregistrée en 2 secondes environ, quels que soient ces réglages. Ils décident seulement de la fréquence de copie de l'image elle-même.
settings.snapshot.c.small=Les images de moins de {0} Mo d''objets sont copiées à chaque changement : un crash fait perdre au plus quelques secondes de travail.
settings.snapshot.c.largeInterval=Les images de {0} Mo ou plus sont copiées juste après chaque étape clé, et sinon au plus toutes les {1} s : un crash peut faire perdre jusqu''à {1} s de retouches (dessin, déplacement, renommage…), à refaire à la main.
settings.snapshot.c.largeKeyOnly=Les images de {0} Mo ou plus ne sont copiées qu''après les étapes clés : un crash fait perdre toutes les retouches faites depuis la dernière étape clé, à refaire à la main — même si elle est ancienne.
settings.snapshot.c.disk=Compromis : un seuil plus bas ou un intervalle plus court protège plus de travail mais écrit davantage sur le disque (chaque copie réécrit tout le fichier d'objets) ; un seuil plus haut ou un intervalle plus long écrit moins mais laisse plus à refaire après un crash.

