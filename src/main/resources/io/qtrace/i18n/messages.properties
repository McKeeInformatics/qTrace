# Settings › Autosave — image copy (crash recovery)
settings.snapshot.title=Image copy (crash recovery)
settings.snapshot.intro=To restore an image exactly as it was after a crash, qTrace also keeps a copy of what you did on it: objects (annotations, detections, measurements) and history — never the pixels. It exists only while the image has unsaved changes and is deleted as soon as you save or close the image. Small for annotations, it can reach hundreds of MB with many detections, and it is rewritten in full at each copy.
settings.snapshot.auto=Auto (recommended) — copy small images after every change; large images right after key steps, other edits at most every {0} s
settings.snapshot.custom=Custom — set the limits yourself
settings.snapshot.threshold=An image is "large" from (MB of objects)
settings.snapshot.interval=Copy large images at most every (seconds)
settings.snapshot.keyOnly=Large images: copy only after key steps (never for manual edits alone)
settings.snapshot.keyOnly.hint=Key steps: any QuPath command (detection, classifier, script, measurements…) and any batch of 10 objects or more added or deleted at once. Manual edits: drawing, moving, reshaping, renaming or reclassifying a few objects.
settings.snapshot.consequences=What this means for you
settings.snapshot.off=Autosave is off: nothing is saved without a stamp, and nothing can be restored after a crash.
settings.snapshot.c.capture=Your qTrace capture (steps, corrections, notes) is always saved within about 2 seconds, whatever these settings. They only decide how often the image itself is copied.
settings.snapshot.c.small=Images under {0} MB of objects are copied after every change: a crash loses at most a few seconds of work.
settings.snapshot.c.largeInterval=Images of {0} MB or more are copied right after each key step, and otherwise at most every {1} s: a crash can lose up to {1} s of manual edits (drawing, moving, renaming…), to redo by hand.
settings.snapshot.c.largeKeyOnly=Images of {0} MB or more are copied only after key steps: a crash loses every manual edit made since the last key step, to redo by hand — however long ago it was.
settings.snapshot.c.disk=Trade-off: a lower threshold or a shorter interval protects more work but writes more to disk (each copy rewrites the whole object file); a higher threshold or a longer interval writes less but leaves more to redo after a crash.
