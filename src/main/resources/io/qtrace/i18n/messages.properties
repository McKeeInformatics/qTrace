# Live autosave (draft) + crash recovery
settings.autosave=Autosave the capture continuously (work is kept even without a stamp)
settings.autosave.hint=qTrace writes your capture to a local draft every few seconds. Closing or switching an image without stamping keeps it as an unstamped session in the .qtrace, and after a crash qTrace offers to restore the image and the capture exactly as they were.
