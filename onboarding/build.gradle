// qTrace onboarding — the public "trunk" module (docs/architecture/loader.md § 17).
// Shipped in qtrace-bootstrap.json next to Core, so every new install runs it.
// Build: cd qtrace-core && ./gradlew jar && ./gradlew -p onboarding qtjar
plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.qtrace'
version = '1.0.0'

// Built against the Core of the same commit: it needs that Core (BrowserOpener,
// QTraceUpdater.installModulesNow) and says so to the loader (Qtrace-Requires).
def coreVersion = (file('../build.gradle').text =~ /(?m)^version = '([^']+)'/)[0][1]

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.scijava.org/content/repositories/public' }
}

ext.qupathVersion = '0.5.1'

javafx {
    version       = '21'
    modules       = ['javafx.controls', 'javafx.graphics', 'javafx.base', 'javafx.web']
    configuration = 'compileOnly'
}

dependencies {
    compileOnly fileTree('../build/libs') { include "qtrace-core-${coreVersion}.jar" }
    compileOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    compileOnly "io.github.qupath:qupath-core:${qupathVersion}"
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'qtrace-onboarding'
    manifest {
        attributes 'Implementation-Title':   'qTrace Onboarding',
                   'Implementation-Version': version,
                   // Self-description read by the qTrace loader (loader.md § 14, § 17).
                   'Qtrace-Module':          'onboarding',
                   'Qtrace-Version':         version,
                   'Qtrace-Requires':        "core>=${coreVersion}",
                   'Qtrace-Load-Order':      '30',
                   'Qtrace-Entry-Point':     'io.qtrace.onboarding.OnboardingExtension',
                   'Qtrace-Packages':        'io.qtrace'
    }
}

apply from: '../gradle/qtjar.gradle'
