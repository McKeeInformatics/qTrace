// qTrace Version Graph — the Version(s) window: the history of a record as a graph of sessions,
// the detail of each session and its instructions. It only reads; other modules can build a
// window of their own on it. Brought to Core through the VersionGraphs hook. Who receives it is declared
// in BackOffice › Extensions. GPL v3, published with the Core sources.
// Build: cd qtrace-core && ./gradlew jar && ./gradlew -p versiongraph qtjar
plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.qtrace'
version = '0.1.0'

def coreVersion = (file('../build.gradle').text =~ /(?m)^version = '([^']+)'/)[0][1]

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.scijava.org/content/repositories/public' }
}

ext.qupathVersion = '0.5.1'

javafx {
    version       = '21'
    modules       = ['javafx.controls', 'javafx.graphics', 'javafx.base']
    configuration = 'compileOnly'
}

dependencies {
    compileOnly fileTree('../build/libs') { include "qtrace-core-${coreVersion}.jar" }
    compileOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    compileOnly "io.github.qupath:qupath-core:${qupathVersion}"
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'org.slf4j:slf4j-api:2.0.9'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testImplementation fileTree('../build/libs') { include "qtrace-core-${coreVersion}.jar" }
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'qtrace-versiongraph'
    manifest {
        attributes 'Implementation-Title':   'qTrace Version Graph',
                   'Implementation-Version': version,
                   // Self-description read by the qTrace loader (loader.md § 14).
                   'Qtrace-Module':          'versiongraph',
                   'Qtrace-Version':         version,
                   'Qtrace-Requires':        "core>=${coreVersion}",
                   'Qtrace-Load-Order':      '26',
                   'Qtrace-Entry-Point':     'io.qtrace.versiongraph.VersionGraphExtension',
                   'Qtrace-Packages':        'io.qtrace'
    }
}

apply from: '../gradle/qtjar.gradle'
