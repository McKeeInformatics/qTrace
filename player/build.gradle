// qTrace Player — the replay player (mini-player under the viewers, full Player window, pre-flight
// check, replay engine and its CLI), brought to Core through the Players hook. Served to everyone
// with the Core release (qtrace-bootstrap.json). GPL v3, published with the Core sources.
// Build: cd qtrace-core && ./gradlew jar && ./gradlew -p player qtjar
plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'io.qtrace'
version = '0.1.4'

def coreVersion = (file('../build.gradle').text =~ /(?m)^version = '([^']+)'/)[0][1]

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    maven { url 'https://maven.scijava.org/content/repositories/public' }
}

ext.qupathVersion = '0.5.1'

javafx {
    version       = '21'
    modules       = ['javafx.controls', 'javafx.graphics', 'javafx.fxml', 'javafx.base']
    configuration = 'compileOnly'
}

configurations {
    cliOnly
}

dependencies {
    // qtrace-core is required at runtime — loaded by the qTrace loader next to this module.
    // Pin to the current version: build/libs accumulates every past version (gradle never
    // cleans), and a "*" glob puts the oldest jar first on the classpath, shadowing newly
    // added interface methods.
    compileOnly fileTree("../build/libs") { include "qtrace-core-${coreVersion}.jar" }

    compileOnly "io.github.qupath:qupath-core:${qupathVersion}"
    compileOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    // Groovy is bundled by QuPath at runtime (not shaded into our JAR) — compileOnly, version
    // pinned only for compile-time GroovyShell/Binding API stability, unaffected at runtime.
    compileOnly 'org.apache.groovy:groovy:4.0.15'
    compileOnly 'com.google.code.gson:gson:2.10.1'
    compileOnly 'ch.qos.logback:logback-classic:1.4.14'

    // Gson bundled only in the CLI fat JAR (provided by QuPath at plugin runtime)
    cliOnly 'com.google.code.gson:gson:2.10.1'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testImplementation 'org.assertj:assertj-core:3.25.1'
    testImplementation fileTree("../build/libs") { include "qtrace-core-${coreVersion}.jar" }
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testCompileOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    testRuntimeOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    testRuntimeOnly "io.github.qupath:qupath-core:${qupathVersion}"
}

test {
    useJUnitPlatform()
}

// The screenshot harness (player.png) lives in tools/screenshots/, outside the public Core tree.

jar {
    archiveBaseName = 'qtrace-player'
    manifest {
        attributes 'Implementation-Title':   'qTrace Player',
                   'Implementation-Version': version,
                   'Built-By':               'Romain Tourte',
                   'Main-Class':             'io.qtrace.player.QTraceReplayCLI',
                   // Self-description read by the qTrace loader (docs/architecture/loader.md § 14).
                   'Qtrace-Module':          'player',
                   'Qtrace-Version':         version,
                   'Qtrace-Requires':        "core>=${coreVersion}",
                   'Qtrace-Load-Order':      '25',
                   'Qtrace-Entry-Point':     'io.qtrace.player.PlayerExtension',
                   'Qtrace-Packages':        'io.qtrace'
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Fat JAR for standalone CLI use — bundles Gson (normally provided by QuPath at plugin runtime)
tasks.register('cliJar', Jar) {
    archiveBaseName    = 'qtrace-replay-cli'
    archiveVersion     = version
    archiveClassifier  = ''
    manifest {
        attributes 'Implementation-Title':   'QTrace Replay CLI',
                   'Implementation-Version': version,
                   'Main-Class':             'io.qtrace.player.QTraceReplayCLI'
    }
    from sourceSets.main.output
    from { configurations.cliOnly.collect { it.isDirectory() ? it : zipTree(it) } }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

apply from: '../gradle/qtjar.gradle'
